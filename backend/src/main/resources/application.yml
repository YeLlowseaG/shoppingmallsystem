spring:
  application:
    name: shopping-mall-system

  # 激活本地环境配置（每个开发者创建自己的 application-local.yml）
  profiles:
    active: local

  # 禁用H2数据库自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

  # 数据源配置（手动配置Druid）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/chengren_shopping_mall?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 12345678
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # 邮件配置（QQ邮箱）
  mail:
    host: smtp.qq.com
    port: 587
    username: 501360872@qq.com  # 请修改为实际的QQ邮箱地址
    password: bokvnbgivdjwbjhb  # 请修改为QQ邮箱授权码（不是登录密码）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 服务器配置
server:
  port: 8081
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    root: INFO
    com.shoppingmall: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/shopping-mall.log
    max-size: 10MB
    max-history: 30

# 文件存储配置
file:
  upload:
    path: D:/uploads
    max-size: 10485760  # 10MB（字节）
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
    image-path: D:/uploads/images
    document-path: D:/uploads/documents

# JWT配置
jwt:
  secret: shopping-mall-secret-key-2025-12-04-change-in-production
  expiration: 86400000  # 24小时，单位：毫秒

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 订单配置
order:
  # 待付款订单自动取消时间（小时），默认6小时
  payment-timeout-hours: 6

# 应用配置
app:
  frontend:
    url: http://localhost:3002  # 前端地址，用于生成重置密码链接
  password:
    reset:
      token-expire-minutes: 30  # 密码重置令牌有效期（分钟）