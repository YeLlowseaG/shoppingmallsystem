# 测试环境配置
spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 测试服务器数据库连接
    url: jdbc:mysql://43.139.206.84:13306/shopping_mall_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 支持环境变量配置，格式：${环境变量名:默认值}
    username: ${DB_USERNAME:shopping_mall}
    password: ${DB_PASSWORD:Abc@123456}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  # 邮件配置（QQ邮箱）
  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:501360872@qq.com}  # 支持环境变量配置
    password: ${MAIL_PASSWORD:bokvnbgivdjwbjhb}  # 支持环境变量配置
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 测试环境可以输出SQL到控制台，便于调试
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 服务器配置 - 测试环境使用8082端口
server:
  port: 8082  # 测试环境端口（与正式环境8081不同）
  servlet:
    context-path: /
    # 支持HTTPS代理
    forward-headers-strategy: framework

# 日志配置
logging:
  level:
    root: INFO
    com.shoppingmall: DEBUG  # 测试环境开启DEBUG日志，便于排查问题
    org.springframework.web: DEBUG  # 开启Spring Web调试日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/shopping-mall-test.log
    max-size: 10MB
    max-history: 30

# 文件存储配置 - 测试环境独立目录
file:
  upload:
    path: /www/wwwroot/shopping-mall-backend-test/uploads
    max-size: 10485760  # 10MB（字节）
    allowed-types: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx
    image-path: /www/wwwroot/shopping-mall-backend-test/uploads/images
    document-path: /www/wwwroot/shopping-mall-backend-test/uploads/documents

# JWT配置
jwt:
  # 测试环境密钥（生产环境请使用更复杂的密钥）
  secret: ${JWT_SECRET:shopping-mall-secret-key-test-2025-12-24}
  expiration: 86400000  # 24小时，单位：毫秒

# Swagger配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 测试环境默认开启Swagger，便于API测试
    enabled: ${SWAGGER_ENABLED:true}

# 订单配置
order:
  # 待付款订单自动取消时间（小时），默认6小时
  payment-timeout-hours: 6

# 应用配置
app:
  frontend:
    # 前端地址，用于生成重置密码链接等（如需测试环境，使用test前缀子域名）
    url: ${FRONTEND_URL:https://test-www.shop.quaichao.com}
  password:
    reset:
      token-expire-minutes: 30  # 密码重置令牌有效期（分钟）
